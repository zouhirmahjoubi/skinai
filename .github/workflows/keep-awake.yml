# Render's free plan sleeps after 15 idle minutes, and the next visit then takes
# about a minute. This keeps the demo awake for judging. It only reads /api/status,
# which needs no access code and spends no YouCam units or KIE credits.
# GitHub can run scheduled jobs late, so an occasional slow first load is still possible.
name: Keep the demo awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read the status page
        run: curl --fail --silent --show-error --max-time 100 --retry 2 --retry-delay 10 --retry-all-errors https://ahead-skinai.onrender.com/api/status
